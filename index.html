<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lacak pengeluaran harian dan visualisasikan anggaran Anda.">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">

    <header>
      <div>
        <h1>💰 Expense Tracker</h1>
        <p id="totalBalance">Total: Rp 0</p>
        <p id="limitWarning" class="hidden">⚠️ Pengeluaran melebihi limit Rp 1.000.000!</p>
      </div>
      <button id="themeToggle" aria-label="Toggle dark mode">🌙 Dark</button>
    </header>

    <section class="card">
      <h2>Tambah Transaksi</h2>
      <form id="expenseForm" novalidate>
        <input
          type="text"
          id="itemName"
          placeholder="Nama item"
          autocomplete="off"
          required
        >
        <input
          type="number"
          id="amount"
          placeholder="Nominal (Rp)"
          min="1"
          step="1000"
          required
        >
        <div class="row">
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <button type="button" id="addCategoryBtn">+ Kategori</button>
        </div>
        <button type="submit" class="primary">Tambah Pengeluaran</button>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Transaksi</h2>
        <select id="sortBy" aria-label="Urutkan transaksi">
          <option value="newest">Terbaru</option>
          <option value="amount-high">Nominal: Tinggi → Rendah</option>
          <option value="amount-low">Nominal: Rendah → Tinggi</option>
          <option value="category">Kategori</option>
        </select>
      </div>
      <div id="transactionList" class="transaction-list" role="list"></div>
    </section>

    <section class="card">
      <h2>Grafik Pengeluaran</h2>
      <canvas id="expenseChart" aria-label="Pie chart pengeluaran per kategori" role="img"></canvas>
    </section>

  </div>
  <script src="js/app.js"></script>
</body>
</html>
